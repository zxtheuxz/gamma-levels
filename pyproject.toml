[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-levels"
version = "0.3.3"
description = "Scanner swing de CALLs com dados públicos D-1 da B3"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyarrow>=16",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gamma-levels = "gamma_levels.cli:main"
gamma-levels-study = "gamma_levels.study_cli:main"

[tool.setuptools.packages.find]
include = ["gamma_levels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
