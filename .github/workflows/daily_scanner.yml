name: Socio Gamma Levels Cloud Scanner

on:
  schedule:
    # 12:40 UTC = 09:40 BRT (Pré-Abertura B3)
    - cron: '40 12 * * 1-5'
    # 21:30 UTC = 18:30 BRT (Pós-Fechamento B3 e CBOE)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scipy httpx

      - name: Run Cloud Daily Scanner (B3 + US CBOE + Telegram)
        run: |
          python scripts/cloud_daily_runner.py

      - name: Commit and push updated cache and reports
        run: |
          git config user.name "Gamma Levels Cloud Bot"
          git config user.email "bot@gammalevels.local"
          git add cloud_cache/ cloud_reports/
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloud): auto-update daily options briefing and cache [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
